# Builds every release target when a version tag (v1.2.3) is pushed and attaches them to a
# GitHub release. Run it by hand (workflow_dispatch) to just get the artifacts.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:min
      - name: Package web version
        run: |
          mkdir -p out
          cp -r dist/web project-sunburn-web
          find project-sunburn-web -name '*.map' -delete
          cp README.md MODDING.md project-sunburn-web/
          zip -qr out/ProjectSunburn-${GITHUB_REF_NAME#v}-web.zip project-sunburn-web
          (cd examples && zip -qr ../out/sepia-island-example-mod.zip sepia-island)
      - uses: actions/upload-artifact@v4
        with: { name: web, path: out/* }

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage tar.gz --x64 --arm64
          - os: windows-latest
            args: --win zip --x64 --arm64 -c.win.signAndEditExecutable=true
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run desktop:prepare
      - name: Install Electron tooling
        working-directory: electron
        run: npm ci
      - name: Build
        working-directory: electron
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then npm version "$VERSION" --no-git-tag-version --allow-same-version; fi
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.zip
            dist/desktop/*.AppImage
            dist/desktop/*.tar.gz
            dist/desktop/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
