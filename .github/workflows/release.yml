# Builds every release target and publishes a GitHub release.
#  * push to main with a new "version" in package.json -> release v<version> (tag created here)
#  * push of a tag v1.2.3                               -> release for that tag
#  * manual run (workflow_dispatch)                     -> artifacts only, no release
name: Release
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:min
      - name: Package web version
        run: |
          mkdir -p out
          cp -r dist/web project-sunburn-web
          find project-sunburn-web -name '*.map' -delete
          cp README.md MODDING.md project-sunburn-web/
          zip -qr out/ProjectSunburn-${{ needs.version.outputs.version }}-web.zip project-sunburn-web
          (cd examples && zip -qr ../out/sepia-island-example-mod.zip sepia-island)
      - uses: actions/upload-artifact@v4
        with: { name: web, path: out/* }

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux AppImage tar.gz --x64 --arm64
          - os: windows-latest
            args: --win zip --x64 --arm64 -c.win.signAndEditExecutable=true
          - os: macos-latest
            args: --mac dmg zip --x64 --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run desktop:prepare
      - name: Install Electron tooling
        working-directory: electron
        run: npm ci
      - name: Build
        working-directory: electron
        shell: bash
        run: |
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version --allow-same-version
          npx electron-builder ${{ matrix.args }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.zip
            dist/desktop/*.AppImage
            dist/desktop/*.tar.gz
            dist/desktop/*.dmg

  release:
    if: needs.version.outputs.release == 'true'
    needs: [version, web, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Project Sunburn ${{ needs.version.outputs.version }}
          files: artifacts/*
          generate_release_notes: true
          body: |
            **Downloads:** Windows (`win-x64` / `win-arm64` zip), macOS (`mac-arm64` / `mac-x64` dmg), Linux / Steam Deck (`AppImage`, `tar.gz`, x64 and arm64), web version (`web.zip`, or play at https://emil007.github.io/Project-Sunburn/).
            You need your own Holiday Island CD image (English or German). See the README for details.
